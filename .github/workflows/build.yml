name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build with this workflow (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sitegeist-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # On manual repair runs, tooling comes from the selected workflow branch,
      # while extension sources are always checked out from the exact release tag.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          path: release-tooling
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag and load dependency pins
        id: release
        run: node release-tooling/scripts/ci-release.mjs configure
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

      - name: Checkout tagged extension sources
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_ref }}
          path: sitegeist
          persist-credentials: false

      - name: Checkout pinned mini-lit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.release.outputs.mini_lit_repository }}
          ref: ${{ steps.release.outputs.mini_lit_commit }}
          path: mini-lit
          persist-credentials: false

      - name: Checkout pinned pi-mono
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.release.outputs.pi_mono_repository }}
          ref: ${{ steps.release.outputs.pi_mono_commit }}
          path: pi-mono
          persist-credentials: false

      - name: Apply and verify reviewed Pi compatibility patch
        run: node release-tooling/scripts/ci-release.mjs prepare-dependencies "$GITHUB_WORKSPACE"

      - name: Test dependency preparation and release safeguards
        run: node --test release-tooling/test/ci-release.test.mjs

      - name: Verify source manifest matches the release tag
        run: node release-tooling/scripts/ci-release.mjs validate-source "$RELEASE_TAG" "$GITHUB_WORKSPACE/sitegeist"
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Install native dependencies and build only extension packages
        working-directory: sitegeist
        run: ./build-all.sh --install

      - name: Check extension types and regression tests
        working-directory: sitegeist
        run: |
          ../pi-mono/node_modules/.bin/tsc --noEmit -p tsconfig.json
          npm test

      - name: Record source provenance and release notes
        run: node release-tooling/scripts/ci-release.mjs record-build "$RELEASE_TAG" "$GITHUB_WORKSPACE"
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Create extension zip
        working-directory: sitegeist/dist-chrome
        run: |
          find . -name '*.map' -type f -delete
          zip -r ../sitegeist.zip .

      - name: Upload tested release files
        uses: actions/upload-artifact@v4
        with:
          name: sitegeist-${{ steps.release.outputs.tag }}
          path: |
            sitegeist/sitegeist.zip
            sitegeist/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitegeist-${{ needs.build.outputs.tag }}

      - name: Create release or replace its rebuilt extension archive
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" sitegeist.zip --clobber
          else
            gh release create "$RELEASE_TAG" sitegeist.zip \
              --verify-tag \
              --title "Sitegeist $RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
